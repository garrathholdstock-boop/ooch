<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12293F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ooch admin">
<meta name="format-detection" content="telephone=no">
<title>ooch admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312293F'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-style='italic' font-size='30' fill='%238FC9EE' text-anchor='middle'%3Eo%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2312293F'/%3E%3Ctext x='90' y='118' font-family='Georgia,serif' font-style='italic' font-size='76' fill='%238FC9EE' text-anchor='middle'%3Eooch%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --f-xs:clamp(.68rem,.65rem + .14vw,.76rem);
  --f-sm:clamp(.8rem,.77rem + .18vw,.9rem);
  --f-base:clamp(.9rem,.87rem + .2vw,1rem);
  --f-md:clamp(1rem,.95rem + .3vw,1.18rem);
  --f-lg:clamp(1.3rem,1.1rem + .9vw,1.9rem);
  --f-xl:clamp(1.7rem,1.3rem + 1.9vw,2.7rem);
  --f-num:clamp(1.5rem,1.15rem + 1.7vw,2.3rem);
  --s-1:clamp(.25rem,.22rem + .14vw,.4rem);
  --s-2:clamp(.5rem,.44rem + .28vw,.8rem);
  --s-3:clamp(.75rem,.66rem + .42vw,1.1rem);
  --s-4:clamp(1rem,.86rem + .62vw,1.6rem);
  --s-5:clamp(1.4rem,1.15rem + 1.1vw,2.4rem);
  --gutter:clamp(.85rem,.5rem + 1.6vw,1.8rem);
  --r:clamp(.75rem,.6rem + .7vw,1.15rem);
  --ink:#12293F; --ink-soft:#5B7A96; --mute:#93AEC8;
  --blue:#8FC9EE; --blue-deep:#2C7BB8; --wash:#EFF7FD; --line:#DCEBF7;
  --paper:#fff; --bg:#F5FAFE;
  --up:#1F8A5C; --up-w:#E2F4EB; --down:#A94F57; --down-w:#F8E9EA;
  --warn:#B8791D; --warn-w:#FBF1DE;
  --shadow:0 2px 14px rgba(20,60,100,.06);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:'Nunito',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:var(--f-base);color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1,h2,h3,h4{font-family:'Baloo 2',cursive;margin:0;letter-spacing:-.015em;line-height:1.12}
:focus-visible{outline:3px solid var(--blue-deep);outline-offset:2px;border-radius:.35rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.shell{display:flex;min-height:100vh;min-height:100dvh}

/* ---------- sidebar ---------- */
aside{
  inline-size:15.5rem;flex-shrink:0;background:var(--paper);border-inline-end:1px solid var(--line);
  position:sticky;inset-block-start:0;block-size:100vh;block-size:100dvh;overflow-y:auto;
  display:flex;flex-direction:column;padding-block-start:env(safe-area-inset-top);
}
.logo{padding:var(--s-4) var(--s-4) var(--s-3);display:flex;align-items:baseline;gap:.5em}
.logo b{font-family:'Baloo 2',cursive;font-size:1.8rem;font-weight:800;color:var(--blue-deep);line-height:1}
.logo span{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:800}
nav{padding:0 .6rem var(--s-4);flex:1}
.ngroup{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:800;padding:var(--s-3) .7rem .3rem}
nav button{display:flex;align-items:center;gap:.65em;inline-size:100%;background:none;border:0;
  padding:.55em .7em;border-radius:.7em;font-size:var(--f-sm);font-weight:700;color:var(--ink-soft);text-align:start;margin-block-end:1px}
nav button:hover{background:var(--wash);color:var(--ink)}
nav button[aria-current="page"]{background:var(--ink);color:#fff}
nav .ic{inline-size:1.2em;text-align:center;flex-shrink:0}
nav .tag{margin-inline-start:auto;background:var(--down);color:#fff;font-size:.72rem;border-radius:999px;padding:.05em .5em;font-weight:800}
nav button[aria-current="page"] .tag{background:#fff;color:var(--ink)}
.whoami{padding:var(--s-3) var(--s-4) calc(var(--s-3) + env(safe-area-inset-bottom));border-block-start:1px solid var(--line);font-size:var(--f-xs);color:var(--ink-soft)}
.whoami b{display:block;color:var(--ink);font-size:var(--f-sm)}

/* ---------- main ---------- */
main{flex:1;min-inline-size:0;padding:var(--s-4) var(--gutter) 5rem;max-inline-size:82rem}
.head{display:flex;align-items:flex-start;gap:var(--s-3);flex-wrap:wrap;margin-block-end:.3em}
.head h1{font-size:var(--f-xl)}
.sub{color:var(--ink-soft);font-size:var(--f-sm);margin:.35em 0 var(--s-4);max-inline-size:64ch}
.spacer{flex:1}
.btn{background:var(--ink);color:#fff;border:0;border-radius:.65em;padding:.6em 1.1em;font-weight:800;font-size:var(--f-sm)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--down)}
.btn.sm{padding:.4em .8em;font-size:var(--f-xs)}
.btn[disabled]{opacity:.42;cursor:not-allowed}

/* ---------- panels ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-block-end:var(--s-3);overflow:hidden;box-shadow:var(--shadow)}
.panel>h3{padding:var(--s-3) var(--s-4);border-block-end:1px solid var(--line);font-size:var(--f-md);display:flex;align-items:center;gap:var(--s-2)}
.panel>h3 .spacer{flex:1}
.pad{padding:var(--s-4)}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;gap:var(--s-2);margin-block-end:var(--s-3);
  grid-template-columns:repeat(auto-fit,minmax(min(100%,10.5rem),1fr))}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:var(--s-3);box-shadow:var(--shadow)}
.kpi small{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:800;margin-block-end:.35em}
.kpi b{font-family:'Baloo 2',cursive;font-size:var(--f-num);font-weight:700;line-height:1;display:block}
.kpi .d{font-size:var(--f-xs);font-weight:800;margin-block-start:.35em;display:inline-flex;align-items:center;gap:.25em;border-radius:999px;padding:.1em .5em}
.kpi .d.up{background:var(--up-w);color:var(--up)}
.kpi .d.down{background:var(--down-w);color:var(--down)}
.kpi .d.flat{background:var(--wash);color:var(--ink-soft)}

/* ---------- range picker ---------- */
.ranges{display:flex;gap:.3em;flex-wrap:wrap;margin-block-end:var(--s-3)}
.ranges button{border:1px solid var(--line);background:var(--paper);border-radius:999px;
  padding:.45em 1em;font-weight:800;font-size:var(--f-xs);color:var(--ink-soft)}
.ranges button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- pyramid breadcrumb ---------- */
.crumbs{display:flex;gap:.3em;align-items:center;flex-wrap:wrap;margin-block-end:var(--s-3);font-size:var(--f-sm)}
.crumbs button{background:var(--wash);border:1px solid var(--line);border-radius:999px;
  padding:.4em .9em;font-weight:800;font-size:var(--f-xs);color:var(--blue-deep)}
.crumbs .now{background:var(--ink);color:#fff;border-radius:999px;padding:.4em .9em;font-weight:800;font-size:var(--f-xs)}
.crumbs .sep{color:var(--mute)}
.level{display:inline-block;background:var(--blue-deep);color:#fff;border-radius:.4em;
  font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;padding:.2em .5em;margin-inline-end:.5em}

/* ---------- charts ---------- */
.chartbox{padding:var(--s-3) var(--s-4) var(--s-4)}
svg.chart{inline-size:100%;block-size:auto;display:block;overflow:visible}
.legend{display:flex;gap:var(--s-3);flex-wrap:wrap;font-size:var(--f-xs);color:var(--ink-soft);margin-block-start:var(--s-2)}
.legend i{inline-size:.7em;block-size:.7em;border-radius:.2em;display:inline-block;margin-inline-end:.4em}

/* ---------- tables ---------- */
.tablewrap{
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  /* Pure-CSS scroll shadows: the fades only appear when there is
     actually more table to the left or right. background-attachment
     local is what makes them track the scroll position. */
  background:
    linear-gradient(to right, var(--paper) 30%, rgba(255,255,255,0)) left center,
    linear-gradient(to left,  var(--paper) 30%, rgba(255,255,255,0)) right center,
    radial-gradient(farthest-side at 0 50%, rgba(20,60,100,.16), rgba(20,60,100,0)) left center,
    radial-gradient(farthest-side at 100% 50%, rgba(20,60,100,.16), rgba(20,60,100,0)) right center;
  background-repeat:no-repeat;
  background-size:34px 100%,34px 100%,13px 100%,13px 100%;
  background-attachment:local,local,scroll,scroll;
}
.swipe{display:none}
@media (max-width:56rem){
  .swipe{display:block;font-size:var(--f-xs);color:var(--mute);padding:.5em var(--s-4) 0;font-weight:700}
}
table{inline-size:100%;border-collapse:collapse;font-size:var(--f-sm);min-inline-size:32rem}
th{text-align:start;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);
  font-weight:800;padding:.7em var(--s-3);border-block-end:1px solid var(--line);white-space:nowrap}
td{padding:.7em var(--s-3);border-block-end:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-block-end:0}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--wash)}
.bar{block-size:.4em;border-radius:999px;background:var(--wash);overflow:hidden;min-inline-size:3rem}
.bar i{display:block;block-size:100%;background:var(--blue-deep)}

/* ---------- P&L ---------- */
.pl td:first-child{white-space:normal}
.pl .grp{background:var(--wash);font-weight:800}
.pl .tot{font-weight:800;border-block-start:2px solid var(--ink)}
.pl .neg{color:var(--down)}

/* ---------- rows ---------- */
.row{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);border-block-end:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-block-end:0}
.thumb{inline-size:2.8rem;aspect-ratio:4/5;border-radius:.5em;background:var(--wash);flex-shrink:0;padding:.25em;display:grid;place-items:center}
.rmain{flex:1;min-inline-size:8rem}
.rmain b{display:block;font-size:var(--f-sm);font-weight:800}
.rmain span{display:block;font-size:var(--f-xs);color:var(--ink-soft);margin-block-start:.15em}
.pill{font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;border-radius:999px;padding:.2em .6em;white-space:nowrap}
.p-live{background:var(--up-w);color:var(--up)}
.p-draft{background:#EDF2F7;color:var(--ink-soft)}
.p-warn{background:var(--warn-w);color:var(--warn)}
.p-stop{background:var(--down-w);color:var(--down)}

/* ---------- forms ---------- */
label{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--ink-soft);margin-block-end:.35em}
input[type=text],input[type=number],input[type=date],select,textarea{
  inline-size:100%;border:1px solid var(--line);border-radius:.65em;padding:.6em .8em;
  background:var(--paper);font-size:max(16px,var(--f-sm))}
textarea{min-block-size:5rem;resize:vertical}
.field{margin-block-end:var(--s-3)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));gap:var(--s-3)}
.tg{inline-size:2.75rem;block-size:1.6rem;border-radius:999px;border:0;background:#C9DCEA;position:relative;flex-shrink:0;padding:0}
.tg::after{content:"";position:absolute;inset-block-start:.19rem;inset-inline-start:.19rem;inline-size:1.22rem;block-size:1.22rem;
  border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .17s}
.tg[aria-checked="true"]{background:var(--up)}
.tg[aria-checked="true"]::after{transform:translateX(1.15rem)}
.issue{display:flex;gap:.7em;padding:.7em .9em;border-radius:.7em;margin-block-end:.5em;font-size:var(--f-sm);line-height:1.45}
.issue.block{background:var(--down-w);border-inline-start:3px solid var(--down)}
.issue.warn{background:var(--warn-w);border-inline-start:3px solid var(--warn)}
.issue.ok{background:var(--up-w);border-inline-start:3px solid var(--up)}
.hint{font-size:var(--f-xs);color:var(--ink-soft);line-height:1.55;margin-block-start:.5em}
.empty{padding:var(--s-5);text-align:center;color:var(--ink-soft)}
.empty b{display:block;font-family:'Baloo 2',cursive;font-size:var(--f-md);color:var(--ink);margin-block-end:.35em}
.grab{color:var(--mute);font-size:1.1em;user-select:none;flex-shrink:0}

/* ---------- mobile / iOS ---------- */
.topbar{display:none}
.tabbar{display:none}
@media (max-width:56rem){
  .shell{flex-direction:column}
  aside{display:none}
  .topbar{display:flex;align-items:center;gap:var(--s-2);position:sticky;inset-block-start:0;z-index:30;
    background:rgba(255,255,255,.95);border-block-end:1px solid var(--line);
    padding:calc(var(--s-2) + env(safe-area-inset-top)) var(--gutter) var(--s-2)}
  .topbar b{font-family:'Baloo 2',cursive;font-size:1.5rem;color:var(--blue-deep);line-height:1;margin-inline-end:auto}
  .topbar select{inline-size:auto;max-inline-size:11rem;font-weight:800;border-radius:999px;padding:.45em .8em}
  main{padding-block-end:5.6rem;max-inline-size:none}
  .tabbar{display:flex;position:fixed;inset-block-end:0;inset-inline:0;z-index:40;
    background:rgba(255,255,255,.96);border-block-start:1px solid var(--line);
    padding:.35em var(--gutter) calc(.35em + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:.1em;
    font-size:.72rem;font-weight:800;color:var(--ink-soft);padding:.3em 0;min-block-size:2.9rem}
  .tabbar button[aria-current="true"]{color:var(--blue-deep)}
  .tabbar .ic{font-size:1.1rem;line-height:1}
  table{min-inline-size:26rem}
}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .topbar,.tabbar{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
}
.toast{position:fixed;inset-inline:0;inset-block-end:calc(1rem + env(safe-area-inset-bottom));margin-inline:auto;
  inline-size:fit-content;max-inline-size:90vw;background:var(--ink);color:#fff;padding:.75em 1.1em;
  border-radius:.8em;font-weight:700;font-size:var(--f-sm);box-shadow:0 10px 30px rgba(18,41,63,.3);
  transform:translateY(180%);transition:transform .3s cubic-bezier(.2,.9,.3,1.25);z-index:90}
@media (max-width:56rem){ .toast{inset-block-end:calc(5rem + env(safe-area-inset-bottom))} }
.toast.show{transform:translateY(0)}
</style>
</head>
<body>

<div class="topbar">
  <b>ooch</b>
  <select id="mobnav" aria-label="Section"></select>
</div>

<div class="shell">
  <aside>
    <div class="logo"><b>ooch</b><span>Admin</span></div>
    <nav id="nav"></nav>
    <div class="whoami"><b>Signed in as Owner</b>Full access</div>
  </aside>
  <main id="main"></main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="ooch-data.js"></script>
<script>
(function(){
'use strict';
var O = window.OOCH;

var NAV = [
  {g:'Overview', items:[
    {id:'dash', ic:'◈', label:'Dashboard'},
    {id:'analytics', ic:'◭', label:'Analytics'},
    {id:'pl', ic:'€', label:'Profit & loss'},
    {id:'tasks', ic:'!', label:'Needs attention', badge:true}
  ]},
  {g:'Shop', items:[
    {id:'products', ic:'▤', label:'Products'},
    {id:'categories', ic:'▦', label:'Categories'},
    {id:'drops', ic:'◷', label:'Drops & launches'},
    {id:'stock', ic:'▣', label:'Stock & sell-through'},
    {id:'pricing', ic:'◉', label:'Pricing by country'}
  ]},
  {g:'Content', items:[
    {id:'sections', ic:'◫', label:'Website sections'},
    {id:'promos', ic:'★', label:'Promotions'},
    {id:'quiz', ic:'?', label:'Style quiz'},
    {id:'pages', ic:'▭', label:'Pages & policies'},
    {id:'media', ic:'◧', label:'Photo library'}
  ]},
  {g:'Customers', items:[
    {id:'orders', ic:'▧', label:'Orders'},
    {id:'returns', ic:'↩', label:'Returns'},
    {id:'people', ic:'☺', label:'Customers'},
    {id:'email', ic:'✉', label:'Email & SMS'}
  ]},
  {g:'Setup', items:[
    {id:'markets', ic:'⊕', label:'Where we sell'},
    {id:'compliance', ic:'⚖', label:'Compliance'},
    {id:'team', ic:'⚇', label:'Team & access'},
    {id:'settings', ic:'⚙', label:'Settings'}
  ]}
];

var view='dash', range=30, drill={level:'global'}, editing=null;

/* ---------- helpers ---------- */
function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function eur(v){return O.fmtEur(v);}
function eur2(v){try{return new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(v);}catch(e){return '€'+v.toFixed(2);}}
function pct(v,dp){return (v*100).toFixed(dp==null?1:dp)+'%';}
function num(v){try{return new Intl.NumberFormat('en').format(Math.round(v));}catch(e){return Math.round(v);}}
function art(p,col){var fn=O.ART[p.art]||O.ART.tee;return fn(O.COLOURS[col||p.cols[0]].hex,p.name);}
var tid; function toast(m){var t=el('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(tid);tid=setTimeout(function(){t.classList.remove('show');},2400);}

function delta(v,invert){
  var cls = Math.abs(v)<0.005 ? 'flat' : ((v>0)!==!!invert ? 'up':'down');
  var arrow = Math.abs(v)<0.005 ? '·' : (v>0?'▲':'▼');
  return '<span class="d '+cls+'">'+arrow+' '+Math.abs(v*100).toFixed(1)+'%</span>';
}
function kpi(label,value,d,invert){
  return '<div class="kpi"><small>'+esc(label)+'</small><b>'+value+'</b>'+
    (d==null?'':delta(d,invert))+'</div>';
}

/* ================= CHART ENGINE =================
   Hand-rolled SVG. No library, no CDN, no build step — works offline
   on the Hetzner box and in every browser back to IE-era SVG support. */
function chartW(){ return Math.max(320, Math.min(900, (window.innerWidth||900) - (window.innerWidth>896?300:70))); }
function niceMax(v){
  if(v<=0) return 1;
  var mag = Math.pow(10, Math.floor(Math.log(v)/Math.LN10));
  var n = v/mag;
  var step = n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;
  return step*mag;
}
function fmtAxis(v){
  if(v>=1000000) return (v/1000000).toFixed(v%1000000?1:0)+'M';
  if(v>=1000) return (v/1000).toFixed(v%1000?1:0)+'k';
  return String(Math.round(v));
}
function lineChart(values, labels, opts){
  opts = opts||{};
  var w = chartW(), h = opts.h || Math.max(180, Math.min(260, w*0.36));
  var pad = {t:14, r:10, b:26, l:46};
  var max = niceMax(Math.max.apply(null, values.concat([1])));
  var iw = w-pad.l-pad.r, ih = h-pad.t-pad.b, n = values.length;
  var x = function(i){ return pad.l + (n<=1?iw/2:(i/(n-1))*iw); };
  var y = function(v){ return pad.t + ih - (v/max)*ih; };
  var d='';
  values.forEach(function(v,i){ d += (i?' L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1); });
  var a = d + ' L'+x(n-1).toFixed(1)+' '+(pad.t+ih)+' L'+x(0).toFixed(1)+' '+(pad.t+ih)+' Z';
  var grid='', ticks=4;
  for(var g=0; g<=ticks; g++){
    var gv = max*g/ticks, gy = y(gv);
    grid += '<line x1="'+pad.l+'" y1="'+gy.toFixed(1)+'" x2="'+(w-pad.r)+'" y2="'+gy.toFixed(1)+
      '" stroke="#DCEBF7" stroke-width="1"/>'+
      '<text x="'+(pad.l-7)+'" y="'+(gy+3.5).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="#93AEC8">'+
      fmtAxis(gv)+'</text>';
  }
  var xl='', step = Math.max(1, Math.ceil(n/(w<480?4:7)));
  for(var i=0;i<n;i+=step){
    var lab = labels[i] ? labels[i].slice(5) : '';
    xl += '<text x="'+x(i).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-size="10.5" fill="#93AEC8">'+esc(lab)+'</text>';
  }
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Revenue over time">'+
    '<defs><linearGradient id="fg" x1="0" x2="0" y1="0" y2="1">'+
    '<stop offset="0%" stop-color="#2C7BB8" stop-opacity=".26"/>'+
    '<stop offset="100%" stop-color="#2C7BB8" stop-opacity="0"/></linearGradient></defs>'+
    grid + '<path d="'+a+'" fill="url(#fg)"/>'+
    '<path d="'+d+'" fill="none" stroke="#2C7BB8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    xl+'</svg>';
}

function barChart(items, opts){
  opts=opts||{};
  var w = chartW();
  var labelW = Math.min(opts.l||130, w*0.34);
  var barH = w<480?22:30, gap = w<480?8:10;
  var pad={l:labelW, r:Math.min(62,w*0.16), t:6, b:6};
  var h = pad.t+pad.b + items.length*(barH+gap);
  var max = Math.max.apply(null, items.map(function(i){return i.v;}).concat([1]));
  var iw = w-pad.l-pad.r;
  var fs = w<480?10.5:12;
  var maxChars = Math.floor(labelW/(fs*0.55));
  var body = items.map(function(it,i){
    var yy = pad.t + i*(barH+gap);
    var bw = Math.max(2,(it.v/max)*iw);
    var lbl = it.k.length>maxChars ? it.k.slice(0,maxChars-1)+'…' : it.k;
    return '<text x="'+(pad.l-8)+'" y="'+(yy+barH/2+4)+'" text-anchor="end" font-size="'+fs+'" font-weight="700" fill="#12293F">'+
        esc(lbl)+'</text>'+
      '<rect x="'+pad.l+'" y="'+yy+'" width="'+bw.toFixed(1)+'" height="'+barH+'" rx="6" fill="'+(it.c||'#2C7BB8')+'"/>'+
      '<text x="'+(pad.l+bw+7)+'" y="'+(yy+barH/2+4)+'" font-size="'+(fs-0.5)+'" font-weight="700" fill="#5B7A96">'+esc(it.lbl)+'</text>';
  }).join('');
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Comparison">'+body+'</svg>';
}

function donut(items){
  var total = items.reduce(function(s,i){return s+i.v;},0)||1;
  var cx=90,cy=90,r=64,sw=26, off=0;
  var arcs = items.map(function(it){
    var frac = it.v/total;
    var len = frac*2*Math.PI*r;
    var s = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+it.c+'" stroke-width="'+sw+
      '" stroke-dasharray="'+len.toFixed(2)+' '+(2*Math.PI*r).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+
      '" transform="rotate(-90 '+cx+' '+cy+')"/>';
    off += len; return s;
  }).join('');
  return '<svg class="chart" viewBox="0 0 180 180" style="max-width:11rem" role="img" aria-label="Split">'+arcs+'</svg>';
}
var PALETTE = ['#2C7BB8','#8FC9EE','#22335A','#6E93D6','#B4C9DE','#E4D6C1','#43679E'];

/* ---------- ANALYTICS PYRAMID ---------- */
V.analytics = function(){
  var st = O.state;
  var crumbs = '<div class="crumbs"><button onclick="setDrill({level:\'global\'})">Global</button>';
  var opts = {days:range};
  if(drill.mk){ opts.mk=drill.mk; crumbs+='<span class="sep">›</span><button onclick="setDrill({level:\'mk\',mk:\''+drill.mk+'\'})">'+esc(st.markets[drill.mk].name)+'</button>'; }
  if(drill.cat){ opts.cat=drill.cat; var c=O.category(drill.cat);
    crumbs+='<span class="sep">›</span><button onclick="setDrill({level:\'cat\',mk:drill.mk,cat:\''+drill.cat+'\'})">'+esc(c?c.name:drill.cat)+'</button>'; }
  if(drill.pid){ opts.pid=drill.pid; var p=O.product(drill.pid);
    crumbs+='<span class="sep">›</span><span class="now">'+esc(p?p.name:drill.pid)+'</span>'; }
  crumbs+='</div>';

  var a = O.analyse(opts);
  var levelName = drill.pid?'Variant level':drill.cat?'Product level':drill.mk?'Category level':'Country level';

  var html = head('Analytics','Start global, then drill down. Every number below respects where you are in the pyramid.')+
    ranges()+crumbs+
    '<div class="kpis">'+
      kpi('Revenue', eur(a.cur.rev), a.change.rev)+
      kpi('Units', num(a.cur.units), a.change.units)+
      kpi('Orders', num(a.cur.orders), a.change.orders)+
      kpi('Avg order', eur2(a.cur.aov), a.change.aov)+
      kpi('Items per order', a.cur.upt.toFixed(2), null)+
      kpi('Gross margin', pct(a.cur.grossMargin), a.change.grossMargin)+
      kpi('Return rate', pct(a.cur.returnRate), null, true)+
      kpi('New customers', pct(a.cur.newRate), null)+
    '</div>'+
    '<div class="panel"><h3>Revenue trend</h3><div class="chartbox">'+
      lineChart(a.series.values, a.series.labels)+'</div></div>';

  /* --- next level down --- */
  html += '<div class="panel"><h3><span class="level">Next level</span>'+levelName+'</h3><div class="tablewrap"><table>';

  function rowsFrom(map, nameFn, clickFn){
    var keys = Object.keys(map);
    var total = keys.reduce(function(s,k){return s+map[k].rev;},0)||1;
    var topRev = Math.max.apply(null, keys.map(function(k){return map[k].rev;}).concat([1]));
    return keys.map(function(k){ return {k:k,d:map[k]}; })
      .sort(function(x,y){return y.d.rev-x.d.rev;})
      .map(function(r){
        var gm = r.d.rev ? (r.d.rev-r.d.cogs)/r.d.rev : 0;
        var share = r.d.rev/total;
        return '<tr class="click" onclick="'+clickFn(r.k)+'">'+
          '<td><b>'+esc(nameFn(r.k))+'</b></td>'+
          '<td class="num">'+eur(r.d.rev)+'</td>'+
          '<td class="num">'+num(r.d.units)+'</td>'+
          '<td class="num">'+num(r.d.orders||0)+'</td>'+
          '<td class="num">'+pct(gm)+'</td>'+
          '<td style="min-width:5rem"><div class="bar"><i style="width:'+Math.max(3,(r.d.rev/topRev)*100).toFixed(1)+'%"></i></div></td>'+
          '<td class="num">'+pct(share)+'</td></tr>';
      }).join('');
  }

  html += '<thead><tr><th>'+(drill.cat?'Product':drill.mk?'Category':'Country')+
    '</th><th class="num">Revenue</th><th class="num">Units</th><th class="num">Orders</th>'+
    '<th class="num">Margin</th><th>Share</th><th class="num">%</th></tr></thead><tbody>';

  if(drill.pid){
    /* variant level */
    var vs = Object.keys(a.raw.variant).map(function(k){return a.raw.variant[k];})
      .sort(function(x,y){return y.units-x.units;});
    var tot = vs.reduce(function(s,v){return s+v.rev;},0)||1;
    var vmax = Math.max.apply(null, vs.map(function(v){return v.rev;}).concat([1]));
    html = html.replace('<th>Product</th>','<th>Colour &amp; size</th>');
    html += vs.length? vs.map(function(v){
      return '<tr><td><b>'+esc(O.COLOURS[v.col]?O.COLOURS[v.col].name:v.col)+' · '+esc(v.sz)+'</b></td>'+
        '<td class="num">'+eur(v.rev)+'</td><td class="num">'+num(v.units)+'</td><td class="num">—</td>'+
        '<td class="num">—</td><td><div class="bar"><i style="width:'+Math.max(3,(v.rev/vmax)*100).toFixed(1)+'%"></i></div></td>'+
        '<td class="num">'+pct(v.rev/tot)+'</td></tr>';
    }).join('') : '<tr><td colspan="7" style="color:var(--ink-soft)">No sales in this period.</td></tr>';
  } else if(drill.cat){
    html += rowsFrom(a.raw.prod, function(k){var p=O.product(k);return p?p.name:k;},
      function(k){return 'setDrill({level:\'prod\',mk:drill.mk,cat:drill.cat,pid:\''+k+'\'})';});
  } else if(drill.mk){
    html += rowsFrom(a.raw.cat, function(k){var c=O.category(k);return c?c.name:k;},
      function(k){return 'setDrill({level:\'cat\',mk:drill.mk,cat:\''+k+'\'})';});
  } else {
    html += rowsFrom(a.raw.mk, function(k){return st.markets[k]?st.markets[k].name:k;},
      function(k){return 'setDrill({level:\'mk\',mk:\''+k+'\'})';});
  }
  html += '</tbody></table></div><p class="swipe">Swipe the table sideways for more →</p>';
  if(!drill.pid) html += '<div class="pad" style="padding-top:0"><p class="hint">Tap any row to go a level deeper.</p></div>';
  html += '</div>';

  /* --- channel & device --- */
  var chan = Object.keys(a.raw.chan).map(function(k,i){return {k:k,v:a.raw.chan[k],c:PALETTE[i%PALETTE.length],lbl:eur(a.raw.chan[k])};})
    .sort(function(x,y){return y.v-x.v;});
  var dev = Object.keys(a.raw.dev).map(function(k,i){return {k:k,v:a.raw.dev[k],c:PALETTE[i%PALETTE.length],lbl:eur(a.raw.dev[k])};})
    .sort(function(x,y){return y.v-x.v;});
  html += '<div class="panel"><h3>Where they came from</h3><div class="chartbox">'+
    (chan.length?barChart(chan,{l:110}):'<p class="hint">No data.</p>')+'</div></div>';
  html += '<div class="panel"><h3>What they used</h3><div class="chartbox" style="display:flex;gap:var(--s-4);align-items:center;flex-wrap:wrap">'+
    donut(dev)+'<div class="legend" style="flex-direction:column;gap:.5em">'+
    dev.map(function(d){return '<span><i style="background:'+d.c+'"></i>'+esc(d.k)+' — '+d.lbl+'</span>';}).join('')+
    '</div></div></div>';

  return html;
};

      line('Contribution', c.contribution, p.contribution, 'tot')+

/* ---------- TASKS ---------- */
function issuesOf(p){
  var out=[];
  if(!p.hs||p.hs.length<6) out.push(['block','Add a customs code. Without it duty cannot be worked out and overseas customers get charged at the door.']);
  if(!p.fibre) out.push(['block','Add what it is made of. Legally required for EU sales and it changes the duty rate.']);
  if(!p.origin) out.push(['block','Add where it was made.']);
  if(!p.gpsr) out.push(['block','Add the EU responsible person details.']);
  if(!p.alt) out.push(['block','Add a photo description so screen readers can read it out.']);
  if(!p.care) out.push(['warn','Add washing instructions — it reduces returns.']);
  return out;
}
function blocked(p){ return issuesOf(p).some(function(i){return i[0]==='block';}); }
function needsWork(){ return O.state.products.filter(blocked); }

V.tasks = function(){
  var list = needsWork();
  var outs = O.state.products.filter(function(p){return O.stockOf(p.id)===0;});
  return head('Needs attention','Everything here is stopping something from working. Work top down.')+
    (list.length? list.map(function(p){
      return '<div class="panel"><h3>'+esc(p.name)+'</h3><div class="pad">'+
        issuesOf(p).map(function(i){return '<div class="issue '+(i[0]==='block'?'block':'warn')+'"><span>'+
          (i[0]==='block'?'!':'i')+'</span><span>'+esc(i[1])+'</span></div>';}).join('')+
        '<button class="btn" onclick="openProduct(\''+p.id+'\')">Fix it</button></div></div>';
    }).join('') : '<div class="panel"><div class="empty"><b>Nothing is blocked</b>Every product has its customs code, fabric details and photo description.</div></div>')+
    (outs.length? '<div class="panel"><h3>Out of stock</h3>'+outs.map(function(p){
      return '<div class="row"><div class="thumb">'+art(p)+'</div><div class="rmain"><b>'+esc(p.name)+
        '</b><span>Still showing on the website</span></div><button class="btn ghost sm" onclick="openProduct(\''+p.id+'\')">Open</button></div>';
    }).join('')+'</div>':'');
};

/* ---------- STOCK ---------- */
V.stock = function(){
  var rows = O.state.products.map(function(p){
    var left = O.stockOf(p.id);
    var st90 = O.sellThrough(p.id,90);
    var a = O.analyse({days:30,pid:p.id});
    var weekly = a.cur.units/(30/7);
    var cover = weekly>0 ? left/weekly : 999;
    return {p:p,left:left,st:st90,cover:cover,units:a.cur.units};
  }).sort(function(x,y){return x.cover-y.cover;});
  return head('Stock & sell-through','Sell-through is the number fast fashion lives on — what share of the buy has actually sold.')+
    '<div class="panel"><div class="tablewrap"><table><thead><tr>'+
    '<th>Product</th><th class="num">Left</th><th class="num">Sold 30d</th>'+
    '<th class="num">Sell-through 90d</th><th class="num">Weeks of cover</th><th></th></tr></thead><tbody>'+
    rows.map(function(r){
      var flag = r.left===0 ? '<span class="pill p-stop">Sold out</span>'
        : r.cover<2 ? '<span class="pill p-warn">Reorder now</span>'
        : r.cover>26 ? '<span class="pill p-draft">Slow</span>'
        : '<span class="pill p-live">Healthy</span>';
      return '<tr><td><b>'+esc(r.p.name)+'</b></td><td class="num">'+num(r.left)+'</td>'+
        '<td class="num">'+num(r.units)+'</td>'+
        '<td class="num">'+pct(r.st)+'</td>'+
        '<td class="num">'+(r.cover>200?'—':r.cover.toFixed(1))+'</td><td>'+flag+'</td></tr>';
    }).join('')+'</tbody></table></div><p class="swipe">Swipe the table sideways for more →</p>'+
    '<div class="pad" style="padding-top:0"><p class="hint">Weeks of cover is how long the remaining stock lasts at the current rate. Under two weeks means reorder now, if a reorder is even possible before the drop ends.</p></div></div>';
};

V.returns = function(){
  var list = O.orders(200).filter(function(o){return o.returned;}).slice(0,20);
  var a = O.analyse({days:range});
  /* return rate by product — the sizing signal worth watching */
  var byProd = {};
  O.orders(400).forEach(function(o){
    byProd[o.pid] = byProd[o.pid] || {n:0, r:0, name:o.product};
    byProd[o.pid].n++; if(o.returned) byProd[o.pid].r++;
  });
  var worst = Object.keys(byProd).map(function(k){var d=byProd[k];
      return {k:d.name, v:d.n?d.r/d.n:0, n:d.n, lbl:pct(d.n?d.r/d.n:0)};})
    .filter(function(x){return x.n>=6;}).sort(function(x,y){return y.v-x.v;}).slice(0,8);
  return head('Returns','Apparel returns run high. Swim runs higher. Watch which products drive it.')+
    ranges()+
    '<div class="kpis">'+
      kpi('Return rate', pct(a.cur.returnRate), null, true)+
      kpi('Refunded', eur(a.cur.refund), null, true)+
      kpi('Returns waiting', String(list.length), null, true)+

      list.map(function(o){

  var a = O.analyse({days:range});
  var chan = Object.keys(a.raw.chan).map(function(k,i){
    return {k:k, v:a.raw.chan[k], c:PALETTE[i%PALETTE.length], lbl:eur(a.raw.chan[k])};
  }).sort(function(x,y){return y.v-x.v;});
  var mk = Object.keys(a.raw.mk).map(function(k,i){
    return {k:O.state.markets[k]?O.state.markets[k].name:k, v:a.raw.mk[k].orders,
            c:PALETTE[i%PALETTE.length], lbl:num(a.raw.mk[k].orders)+' orders'};
  }).sort(function(x,y){return y.v-x.v;});
  return head('Customers','Who is buying, where they came from, and whether they come back.')+
    ranges()+
    '<div class="kpis">'+
      kpi('Orders', num(c.orders), null)+
      kpi('First-time buyers', pct(c.newRate), null)+
      kpi('Returning', num(c.repeatCount), null)+
      kpi('Average order', eur2(c.aov), null)+
    '</div>'+
    '<div class="panel"><h3>Where they came from</h3><div class="chartbox">'+
      (chan.length?barChart(chan,{l:110}):'<p class="hint">No data.</p>')+'</div></div>'+
    '<div class="panel"><h3>Orders by country</h3><div class="chartbox">'+
      (mk.length?barChart(mk,{l:130}):'<p class="hint">No data.</p>')+'</div></div>'+
    '<div class="panel"><div class="pad">'+
      '<div class="issue warn"><span>i</span><span>Accounts are for 16 and over. Younger shoppers can still '+
      'check out as guests. Do not change this without legal advice — under-15s in France cannot consent to '+
      'their own data being processed.</span></div>'+
      '<p class="hint">Individual customer records live in Shopify in the live build. '+
      'Names here are generated for the demo.</p></div></div>';
};

/* ---------- EMAIL & SMS ---------- */
V.email = function(){
  var st = O.state;
  return head('Email & SMS','Automatic messages. Marketing ones need consent; order updates do not.')+
    '<div class="panel">'+st.flows.map(function(fl){
      return '<div class="row"><div class="rmain"><b>'+esc(fl.name)+'</b><span>'+esc(fl.when)+'</span></div>'+
        '<span class="pill '+(fl.kind==='Marketing'?'p-draft':'p-live')+'">'+esc(fl.kind)+'</span>'+
        '<button class="tg" role="switch" aria-checked="'+fl.live+'" aria-label="Turn on '+esc(fl.name)+
        '" onclick="toggleFlow(\''+fl.id+'\')"></button>'+
        '<button class="btn danger sm" onclick="delFlow(\''+fl.id+'\')">Delete</button></div>';
    }).join('')+'</div>'+
    '<div class="panel"><div class="pad"><p class="hint" style="margin-top:0">'+
    'Marketing email needs a clear opt-in in every country we sell to, and the opt-out has to work. '+
    'Order confirmations and shipping updates are part of the sale, so they always send.</p></div></div>';
};

/* ---------- PAGES ---------- */
V.pages = function(){
  var st = O.state;
  return head('Pages & policies','The written pages. Some are legally required before a country can go live.')+
    '<div class="panel">'+st.pages.map(function(g){
      return '<div class="row"><div class="rmain"><b>'+esc(g.name)+'</b>'+
        '<span>/'+esc(g.slug)+' · '+esc(g.where)+'</span></div>'+
        '<span class="pill '+(g.live?'p-live':'p-draft')+'">'+(g.live?'Live':'Draft')+'</span>'+
        '<button class="tg" role="switch" aria-checked="'+g.live+'" aria-label="Publish '+esc(g.name)+
        '" onclick="togglePage(\''+g.id+'\')"></button>'+
        '<button class="btn danger sm" onclick="delPage(\''+g.id+'\')">Delete</button></div>'+
        (g.body!=null?'<div class="row" style="padding-block-start:0"><div style="flex:1">'+
        '<div class="field"><label>What it says</label><textarea oninput="editPage(\''+g.id+
        '\',\'body\',this.value)">'+esc(g.body)+'</textarea></div></div></div>':'');
    }).join('')+'</div>'+
    '<div class="panel"><div class="pad"><div class="issue warn"><span>i</span><span>'+
    'Germany cannot go live without an Impressum, and the United States needs the Do Not Sell page. '+
    'Both are drafts.</span></div></div></div>';
};

/* ---------- STYLE QUIZ ---------- */
V.quiz = function(){
  var q = O.state.quiz;
  return head('Style quiz','Two questions, four outcomes. Each outcome shows four products.')+
    '<div class="panel"><h3>Questions</h3>'+q.questions.map(function(qq,i){
      return '<div class="row"><span class="grab">⠿</span><div class="rmain"><b>'+esc(qq.text)+'</b>'+
        '<span>'+esc(qq.answers.join(' · '))+'</span></div>'+
        '<button class="btn danger sm" onclick="delQuizQ(\''+qq.id+'\')">Delete</button></div>'+
        '<div class="row" style="padding-block-start:0"><div style="flex:1"><div class="two">'+
        '<div class="field"><label>Question</label><input type="text" value="'+esc(qq.text)+
          '" oninput="editQuizQ(\''+qq.id+'\',this.value)"></div>'+
        '<div class="field"><label>Answers, separated by a comma</label>'+
          '<input type="text" value="'+esc(qq.answers.join(', '))+
          '" oninput="editQuizA(\''+qq.id+'\',this.value)"></div>'+
        '</div></div></div>';
    }).join('')+'</div>'+
    '<div class="panel"><h3>What we show them</h3>'+q.results.map(function(r){
      var names = r.products.map(function(id){var p=O.product(id);return p?p.name:null;}).filter(Boolean);
      return '<div class="row"><div class="rmain"><b>'+esc(r.when)+'</b>'+
        '<span>'+(names.length?esc(names.join(' · ')):'Nothing picked yet')+'</span></div>'+
        '<span class="pill '+(names.length===4?'p-live':'p-warn')+'">'+names.length+' of 4</span></div>';
    }).join('')+
    '<div class="pad"><p class="hint" style="margin-top:0">Deleted products drop out of these lists '+
    'automatically, which is why a result can show fewer than four.</p></div></div>';
};

/* ---------- TEAM ---------- */
V.team = function(){
  var st = O.state;
  return head('Team & access','Who can do what. Editors cannot reach settings, payments, countries or the server.',
    '<button class="btn" onclick="addMember()">Invite someone</button>')+
    '<div class="panel"><div class="tablewrap"><table>'+
    '<thead><tr><th>Name</th><th>Role</th><th>Can do</th><th></th></tr></thead><tbody>'+
    st.team.map(function(t){
      return '<tr><td><b>'+esc(t.name)+'</b></td>'+
        '<td><span class="pill '+(t.role==='Owner'?'p-live':t.role==='Editor'?'p-draft':'p-warn')+'">'+
        esc(t.role)+'</span></td>'+
        '<td style="white-space:normal;color:var(--ink-soft)">'+esc(t.can)+'</td>'+
        '<td>'+(t.role==='Owner'?'':'<button class="btn danger sm" onclick="delMember(\''+t.id+
        '\')">Remove</button>')+'</td></tr>';
    }).join('')+'</tbody></table></div><p class="swipe">Swipe the table sideways for more →</p></div>'+
    '<div class="panel"><h3>What each role means</h3>'+
      '<div class="row"><div class="rmain"><b>Owner</b><span>Everything, including settings, payments, '+
        'countries and billing. Only one person needs this.</span></div></div>'+
      '<div class="row"><div class="rmain"><b>Editor</b><span>Products, photos, content, promotions and drops. '+
        'Can publish. Cannot reach settings or switch countries on.</span></div></div>'+
      '<div class="row"><div class="rmain"><b>Contributor</b><span>Can create and edit drafts. '+
        'Cannot publish anything.</span></div></div>'+
    '</div>'+
    '<div class="panel"><div class="pad"><p class="hint" style="margin-top:0">'+
    'Nobody needs the server. Everything here happens in a browser, and every person gets their own login — '+
    'never a shared one.</p></div></div>';
};

/* ================= ACTIONS ================= */
window.setRange = function(r){ range=r; render(); };
window.setDrill = function(d){ drill=d; render(); window.scrollTo(0,0); };
window.openProduct = function(id){ view='products'; editing=id; render(); window.scrollTo(0,0); };
window.closeProduct = function(){ editing=null; render(); };
window.toggleProduct = function(id){ var p=O.product(id); if(!p)return; p.visible=!p.visible; O.commit();
  toast(p.name+(p.visible?' is back on the website':' is hidden from the website')); };
window.delProduct = function(id){ var p=O.product(id); if(!p)return;
  if(confirm('Delete '+p.name+' permanently? It disappears from the website and the analytics.')){
    O.removeProduct(id); editing=null; toast(p.name+' deleted'); } };
window.toggleCat = function(id){ var c=O.category(id); if(!c)return; c.visible=!c.visible; O.commit();
  toast(c.name+(c.visible?' is showing':' is hidden')); };
window.delCat = function(id){ var c=O.category(id); if(!c)return;
  var n=O.state.products.filter(function(p){return p.cat===id;}).length;
  if(confirm('Delete '+c.name+' and its '+n+' products permanently?')){ O.removeCategory(id); toast(c.name+' deleted'); } };
window.toggleSec = function(id){ var s=O.section(id); if(!s)return; s.visible=!s.visible; O.commit();
  toast(s.name+(s.visible?' is showing':' is hidden')); };
window.delSec = function(id){ var s=O.section(id); if(!s)return;
  if(confirm('Delete the "'+s.name+'" section from the website?')){ O.removeSection(id); toast('Section deleted'); } };
window.moveSec = function(id,d){ O.moveSection(id,d); };
window.editSec = function(id,k,v){ var s=O.section(id); if(!s)return; s.data[k]=v; O.commit(); };
window.togglePromo = function(id){ var p=O.state.promos.filter(function(x){return x.id===id;})[0]; if(!p)return;
  p.live=!p.live; O.commit(); toast(p.name+(p.live?' is running':' stopped')); };
window.delPromo = function(id){ if(confirm('Delete this promotion?')){ O.removePromo(id); toast('Promotion deleted'); } };
window.editPromo = function(id,k,v){ var p=O.state.promos.filter(function(x){return x.id===id;})[0]; if(!p)return;
  p[k]=v; O.commit(); };
window.toggleMk = function(c){ var m=O.state.markets[c]; if(!m)return; m.live=!m.live;
  if(!m.live && O.state.settings.market===c){ O.state.settings.market='AU'; }
  O.commit(); toast(m.name+(m.live?' is live on the website':' switched off')); };
window.editField = function(id,k,v){ var p=O.product(id); if(!p)return; p[k]=v; O.commit(); };
window.editOverride = function(id,code,v){ var p=O.product(id); if(!p)return;
  if(v==='') delete p.overrides[code]; else p.overrides[code]=parseFloat(v); O.commit(); };
window.editSetting = function(k,v){ O.state.settings[k]=v; O.commit(); };

window.delDrop = function(id){ var d=O.findIn('drops',id); if(!d)return;
  if(confirm('Delete the "'+d.name+'" drop?')){ O.removeFrom('drops',id); toast('Drop deleted'); } };
window.editDrop = function(id,k,v){ var d=O.findIn('drops',id); if(!d)return; d[k]=v; O.commit(); };
window.addDrop = function(){ var n=prompt('Name this drop','New drop'); if(!n)return;
  O.state.drops.push({id:'d'+Date.now(),name:n,at:'2026-10-03T09:00',markets:['AU','NZ'],products:[],status:'scheduled'});
  O.commit(); toast(n+' planned'); };
window.togglePage = function(id){ var g=O.findIn('pages',id); if(!g)return; g.live=!g.live; O.commit();
  toast(g.name+(g.live?' published':' unpublished')); };
window.delPage = function(id){ var g=O.findIn('pages',id); if(!g)return;
  if(confirm('Delete the "'+g.name+'" page?')){ O.removeFrom('pages',id); toast('Page deleted'); } };
window.editPage = function(id,k,v){ var g=O.findIn('pages',id); if(!g)return; g[k]=v; O.commit(); };
window.toggleFlow = function(id){ var fl=O.findIn('flows',id); if(!fl)return; fl.live=!fl.live; O.commit();
  toast(fl.name+(fl.live?' switched on':' switched off')); };
window.delFlow = function(id){ var fl=O.findIn('flows',id); if(!fl)return;
  if(confirm('Delete the "'+fl.name+'" message?')){ O.removeFrom('flows',id); toast('Deleted'); } };
window.delMember = function(id){ var t=O.findIn('team',id); if(!t)return;
  if(confirm('Remove '+t.name+"'s access?")){ O.removeFrom('team',id); toast(t.name+' removed'); } };
window.addMember = function(){ var n=prompt('Who are you inviting?'); if(!n)return;
  O.state.team.push({id:'t'+Date.now(),name:n,role:'Contributor',can:'Create drafts only — cannot publish'});
  O.commit(); toast('Invite sent to '+n); };
window.editQuizQ = function(id,v){ var q=O.state.quiz.questions.filter(function(x){return x.id===id;})[0];
  if(!q)return; q.text=v; O.commit(); };
window.editQuizA = function(id,v){ var q=O.state.quiz.questions.filter(function(x){return x.id===id;})[0];
  if(!q)return; q.answers=v.split(',').map(function(s){return s.trim();}).filter(Boolean); O.commit(); };
window.delQuizQ = function(id){ if(!confirm('Delete this question?'))return;
  O.state.quiz.questions=O.state.quiz.questions.filter(function(x){return x.id!==id;}); O.commit(); toast('Question deleted'); };

window.resetAll = function(){ if(confirm('Reset everything back to the start?')){ O.reset(); editing=null; toast('Reset'); } };

/* ================= CHROME ================= */
function renderNav(){
  var bad = needsWork().length;
  el('nav').innerHTML = NAV.map(function(g){
    return '<div class="ngroup">'+g.g+'</div>'+g.items.map(function(i){
      return '<button data-id="'+i.id+'" '+(i.id===view?'aria-current="page"':'')+'>'+
        '<span class="ic" aria-hidden="true">'+i.ic+'</span><span>'+i.label+'</span>'+
        (i.badge&&bad?'<span class="tag">'+bad+'</span>':'')+'</button>';
    }).join('');
  }).join('');
  Array.prototype.forEach.call(el('nav').querySelectorAll('button'), function(b){
    b.onclick = function(){ view=b.dataset.id; editing=null; render(); window.scrollTo(0,0); };
  });

  var sel = el('mobnav');
  sel.innerHTML = NAV.map(function(g){
    return '<optgroup label="'+g.g+'">'+g.items.map(function(i){
      return '<option value="'+i.id+'"'+(i.id===view?' selected':'')+'>'+i.label+
        (i.badge&&bad?' ('+bad+')':'')+'</option>';
    }).join('')+'</optgroup>';
  }).join('');
  sel.onchange = function(){ view=sel.value; editing=null; render(); window.scrollTo(0,0); };

  el('tabbar').innerHTML = [['dash','◈','Home'],['analytics','◭','Stats'],['pl','€','P&L'],
    ['orders','▧','Orders'],['products','▤','Products']]
    .map(function(t){
      return '<button aria-current="'+(view===t[0])+'" onclick="jump(\''+t[0]+'\')">'+
        '<span class="ic" aria-hidden="true">'+t[1]+'</span>'+t[2]+'</button>';
    }).join('');
}
window.jump = function(v){ view=v; editing=null; render(); window.scrollTo(0,0); };

function render(){
  renderNav();
  el('main').innerHTML = (V[view]||V.dash)();
}

O.on(function(state, remote){ render(); if(remote) toast('Updated in another tab'); });
var rz; window.addEventListener('resize', function(){ clearTimeout(rz); rz=setTimeout(render,180); }, {passive:true});
render();
})();
</script>
</body>
</html>
